global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - regras.yml

# Alertmanager é opcional (economiza RAM). Os alertas já aparecem em
# http://localhost:9090/alerts e no Grafana. Para ativar, rode o alertmanager e descomente:
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ["localhost:9093"]

scrape_configs:
  - job_name: conta-corrente
    static_configs:
      - targets: ["localhost:8001"]
  - job_name: clientes
    static_configs:
      - targets: ["localhost:8002"]
